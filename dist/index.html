<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elin 魔法出力計算</title><meta name="description" content="Elin EA 23.347 のソースシートをもとに、通常詠唱の Power とダイスを計算します。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2313233b'/%3E%3Cpath d='M18 3 7 18h8l-2 11L25 13h-9z' fill='%235de0d0'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20260922-calc1"><script defer src="data.js?v=20260922-calc1"></script><script defer src="traits.js?v=20260922-calc1"></script><script defer src="engine.js?v=20260922-calc1"></script><script defer src="app.js?v=20260922-calc1"></script></head>
<body><main><header><div class="mark" aria-hidden="true">✦</div><div><p class="eyebrow">ELIN / SPELL CALCULATOR</p><h1>魔法出力計算</h1></div><span class="version">EA 23.347</span></header>
<p class="intro">魔法・アビリティを検索して、出力と適用される効果を確認。</p>
<div class="workspace"><section class="inputs"><h2><span>01</span> 魔法とキャラクター</h2><form id="form" novalidate><label for="search">魔法・アビリティを検索</label><input id="search" type="search" placeholder="例：炎の矢、治癒、ブレス、50500" autocomplete="off"><div class="search-bar"><label for="kind">種類</label><select id="kind"><option value="">すべて</option><option value="SPELL">魔法</option><option value="ABILITY">アビリティ</option></select><span id="searchCount" role="status"></span></div><label for="spell">検索結果から選択</label><select id="spell" name="spell"></select><p id="spellMeta" class="muted"></p><div class="fields"><div><label id="levelLabel" for="level">魔法レベル（補正後）</label><input id="level" name="level" type="number" value="10" step="1" min="-1000000" max="1000000" required></div><div><label for="attribute" id="attributeLabel">対応する主能力</label><input id="attribute" name="attribute" type="number" value="30" step="1" min="-1000000" max="1000000" required></div><div><label for="enhance">魔法強化</label><input id="enhance" name="enhance" type="number" value="0" step="1" min="-1000000" max="1000000" required></div><div><label for="anti">反魔法</label><input id="anti" name="anti" type="number" value="0" step="1" min="-1000000" max="1000000" required></div></div><p class="hint">装備・状態・陣営などの補正を含む現在値を入力してください。</p></form></section>
<section class="results" aria-live="polite" aria-atomic="true"><h2><span>02</span> 計算結果</h2><p id="error" role="alert" hidden></p><div id="output"><p id="selectedName" class="result-name"></p><div class="effect"><h3>効果</h3><p id="effectDescription"></p></div><div class="metrics"><div><p>POWER <small>p</small></p><strong id="power">—</strong></div><div><p>ダイス</p><strong id="dice">—</strong></div></div><div class="dice-range"><span>出目の範囲（最小〜最大）</span><strong id="diceRange">—</strong></div><p id="diceNote" class="hint"></p><div class="calc-sheet"><h3 id="calcSource">Calc</h3><dl><div><dt>num（ダイス数）</dt><dd id="calc-num"></dd></div><div><dt>sides（面数）</dt><dd id="calc-sides"></dd></div><div><dt>bonus（加算）</dt><dd id="calc-bonus"></dd></div></dl><p>p = Power ／ e = 対応する主能力</p></div><div class="rule"></div><h3>適用される効果・操作</h3><dl id="features" class="features"></dl><p id="featureNote" class="hint"></p></div></section></div>
</main></body></html>
