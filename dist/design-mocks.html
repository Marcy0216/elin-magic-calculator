<style>

rch{display:flex;gap:12px;align-items:center}.search input{flex:1}.spell-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.spell{background:white;border:1px solid #dbe3ed;border-radius:10px;text-align:left;padding:14px;color:#29415e}.spell.active{background:#edf4ff;border-color:#397bcc;box-shadow:inset 0 0 0 1px #397bcc}.spell small{display:block;color:#6b7e96;margin-top:4px}.spell-level{display:flex;gap:14px;align-items:center}.spell-level input{width:110px}.spell-level label{margin:0}.result-head{display:flex;justify-content:space-between;align-items:center}.result-head h3{font-size:24px;margin:0}.tag{background:#eaf1fa;padding:4px 12px;border-radius:20px;color:#345c8b;font-size:12px}.brief{color:#718195;font-size:13px;margin:8px 0 22px}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.number{padding:20px;background:#f4f7fc;border-radius:11px}.number label{letter-spacing:.08em}.number strong{font-size:36px;font-weight:650;color:#205fab;font-variant-numeric:tabular-nums;line-height:1.4}.range{margin-top:14px;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:#eaf5f0;border-radius:10px}.range strong{color:#24745d;font-size:22px}.range span{color:#526f65;font-size:13px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.badges span{padding:5px 11px;border-radius:6px;background:#eef3f8;font-size:12px;color:#53677f}.badges .on{background:#e7f4ec;color:#29704a}.effects{display:grid;gap:8px}.effects>div{display:flex;justify-content:space-between;padding:12px 16px;background:#eaf5f0;border-radius:7px}.effects strong{color:#24745d}.steps{display:none}.next{display:none}.design-b{background:#f5f3ef;color:#343d3a}.design-b .panel{border-color:#dedfd6;border-radius:6px}.design-b header .symbol{background:#426858}.design-b .board{grid-template-columns:1fr 1.15fr}.design-b .profile{grid-column:1/-1}.design-b .stats{grid-template-columns:repeat(10,1fr);gap:8px}.design-b .identity{max-width:600px}.design-b .extras{max-width:600px}.design-b .spell-list{grid-template-columns:1fr}.design-b .spell.active{background:#eef4ec;border-color:#6c8b70;box-shadow:none}.design-b .number{background:#f4f5ef}.design-b .number strong{color:#426858}.design-b h2 span{background:#edf2e8;color:#426858}.design-b .result-head{margin-top:6px}.design-c{background:#f5f3fc}.design-c main{max-width:900px}.design-c header .symbol{background:#7255bd}.design-c .panel{border:0;box-shadow:0 8px 35px #60448a0b;padding:32px}.design-c h2 span{display:none}.design-c .steps{display:flex;margin-bottom:22px;gap:6px}.steps button{flex:1;border:0;border-bottom:3px solid #dcd7eb;background:transparent;padding:12px;color:#857796}.steps button.active{border-color:#795bc0;color:#6546ab;font-weight:700}.design-c .next{display:block;border:0;background:#7255bd;color:#fff;border-radius:8px;padding:11px 24px;margin-top:24px;margin-left:auto}.design-c .number strong{color:#7050b8}.design-c .number{background:#f6f2fc}.design-c .result-head h3{font-size:28px}.design-c .numbers{margin-top:28px}.design-c .number strong{font-size:48px}.design-c .board>.panel{display:none}.design-c .board>.panel.current{display:block}.design-c .spell-list{grid-template-columns:1fr}.design-c .spell.active{border-color:#8064bd;background:#f5f0fe;box-shadow:none}[hidden]{display:none!important}@media(max-width:760px){.choices{gap:6px}.choices button{padding:8px;font-size:13px;flex:1}.choices small{font-size:10px}main{padding:22px 14px}.panel{padding:20px}.stats,.design-b .stats{grid-template-columns:repeat(2,1fr)}.design-b .board{grid-template-columns:1fr}.design-b .profile{grid-column:auto}.spell-list{grid-template-columns:1fr}.number strong{font-size:27px}.identity{flex-wrap:wrap}.identity>div{min-width:100px}.design-c .panel{padding:22px}.design-c .number strong{font-size:34px}h1{font-size:19px}.chooser{padding:16px}.extras{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="design-a"><div class="chooser"><p>デザイン比較 / 同じ入力・結果で3案を切り替えられます</p><nav class="choices" aria-label="デザイン案"><button data-design="a" aria-pressed="true">A · シンプルな縦並び<small>今の流れをすっきり整理</small></button><button data-design="b" aria-pressed="false">B · 比較しやすい2列<small>検索と結果を並べて確認</small></button><button data-design="c" aria-pressed="false">C · 1ステップずつ<small>入力・選択・結果に集中</small></button></nav><p class="mock-label">操作できるモック · 火炎の矢／鈍足／勇気の歌を収録</p></div>
<main><header><h1><span class="symbol">✦</span>Elin 魔法計算</h1><small>EA 23.347</small></header><nav class="steps"><button data-step="0" class="active">01 キャラクター</button><button data-step="1">02 魔法</button><button data-step="2">03 結果</button></nav><div class="board">
<section class="panel profile current"><h2><span>01</span>キャラクター</h2><div class="identity"><div><label for="caster">使用者</label><select id="caster"><option value="pc">PC</option><option value="ally">味方NPC</option><option value="npc">その他NPC</option></select></div><div><label for="lv">キャラクターLv</label><input id="lv" type="number" value="10"></div></div><div id="stats" class="stats"></div><div class="extras"><div><label for="enhance">魔法強化</label><input id="enhance" type="number" value="300"></div><div><label for="anti">反魔法</label><input id="anti" type="number" value="0"></div><div><label for="diva">歌姫</label><input id="diva" type="number" value="0"></div></div><details><summary>その他のスキル</summary><label for="music">演奏</label><input id="music" type="number" value="0"></details><button class="next" data-step="1">魔法を選ぶ →</button></section>
<section class="panel selection"><h2><span>02</span>魔法を選ぶ</h2><div class="search"><input id="query" type="search" aria-label="魔法を検索" placeholder="名前で検索…"></div><div class="spell-list" id="spells"></div><div class="spell-level"><label for="level">魔法・アビリティLv</label><input id="level" type="number" value="10"></div><button class="next" data-step="2">結果を見る →</button></section>
<section class="panel result"><h2><span>03</span>計算結果</h2><div class="result-head"><h3 id="spellName"></h3><span class="tag" id="target"></span></div><p class="brief" id="description"></p><div class="numbers"><div class="number"><label>POWER</label><strong id="power"></strong></div><div class="number"><label id="secondaryLabel">ダイス</label><strong id="secondary"></strong></div></div><div class="range" id="range"><span>出目の範囲</span><strong id="bounds"></strong></div><div id="effects" class="effects"></div><div class="badges" id="badges"></div><details><summary>計算データ・補足</summary><p id="detail"></p></details><p id="error" role="alert"></p><button class="next" data-step="1">別の魔法を選ぶ</button></section>
</div></main><script>
const $=id=>document.getElementById(id),data=ELIN_DATA;let chosen='50500',design='a',step=0;
const attrs=[['STR','筋力'],['END','耐久'],['DEX','器用'],['PER','感覚'],['LER','学習'],['WIL','意志'],['MAG','魔力'],['CHA','魅力'],['LUC','運'],['SPD','速度']];
attrs.forEach(([id,name])=>{const d=document.createElement('div');d.innerHTML='<label for="'+id+'">'+name+'</label><input id="'+id+'" type="number" value="1000">';$('stats').append(d);});
const names={'50500':'火炎の矢','8710':'鈍足','6752':'勇気の歌'};
function list(){const q=$('query').value; $('spells').replaceChildren();for(const [id,name] of Object.entries(names)){if(q&&!name.includes(q))continue;const b=document.createElement('button');b.className='spell'+(chosen===id?' active':'');b.textContent=name;const s=document.createElement('small');s.textContent=id==='50500'?'攻撃 · 地面':id==='8710'?'弱体 · キャラクター':'歌 · 周囲の味方';b.append(s);b.onclick=()=>{chosen=id;list();render();};$('spells').append(b);}}
function render(){try{const row=data.elements.find(r=>r.id===chosen);const num=id=>{if($(id).value==='')throw Error('数値を入力してください');return Number($(id).value);};const r=ElinEngine.calculate({spell:chosen,level:num('level'),attribute:num(row.aliasParent),enhance:num('enhance'),anti:num('anti'),music:num('music'),diva:num('diva'),charisma:num('CHA'),isPC:$('caster').value==='pc',isAlly:$('caster').value==='ally',characterLevel:num('lv')},data);$('error').textContent='';$('spellName').textContent=names[chosen];$('target').textContent=chosen==='50500'?'地面':chosen==='8710'?'キャラクター':'自分 → 周囲の味方';$('description').textContent=row.detail_JP;$('power').textContent=r.power.toLocaleString();$('range').hidden=!r.dice||r.dice.empty;$('secondaryLabel').textContent=chosen==='8710'?'速度の変化':chosen==='6752'?'筋力の変化':'ダイス';$('secondary').textContent=chosen==='8710'?r.statusEffects[0].value:chosen==='6752'?'+'+r.statusEffects.find(e=>e.name==='周囲の味方：筋力').value:r.dice.text;if(r.dice&&!r.dice.empty)$('bounds').textContent=Number(r.dice.min).toLocaleString()+' 〜 '+Number(r.dice.max).toLocaleString();$('effects').replaceChildren();$('badges').innerHTML=chosen==='50500'?'<span class="on">✓ 連続魔法</span><span class="on">✓ 魔法強化</span><span>反魔法の影響あり</span>':chosen==='6752'?'<span class="on">✓ 歌姫</span><span>半径4マス</span>':'<span class="on">✓ 魔法強化</span><span>反魔法の影響あり</span>';$('detail').textContent=r.formula?'num: '+r.formula.num+' / sides: '+r.formula.sides+' / bonus: '+r.formula.bonus:'能力値は付与される補正量。対象の現在値とは別に表示。';if(chosen==='6752')for(const e of r.statusEffects.filter(e=>e.name.startsWith('周囲の味方'))){const d=document.createElement('div');d.textContent=e.name.replace('周囲の味方：','');const v=document.createElement('strong');v.textContent='+'+e.value;d.append(v);$('effects').append(d);}}catch(e){$('error').textContent=e.message;}}
function setStep(n){step=n;document.querySelectorAll('.board>.panel').forEach((e,i)=>e.classList.toggle('current',i===n));document.querySelectorAll('.steps button').forEach((e,i)=>e.classList.toggle('active',i===n));}
document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{design=b.dataset.design;document.body.className='design-'+design;document.querySelectorAll('[data-design]').forEach(e=>e.setAttribute('aria-pressed',e===b));setStep(design==='c'?2:step);});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStep(Number(b.dataset.step)));document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{if(e.id==='query')list();else render();}));list();render();
</script></body></html>
